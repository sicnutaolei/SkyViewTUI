[project]
name = "skyviewtui"
version = "0.1.0"
description = "A terminal-based weather dashboard with live GIF animations"
readme = "README.md"
authors = [{name = "sicnutaolei", email = "susetaolei@163.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "textual>=0.50.0",
    "httpx>=0.27.0",
    "tomli; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "webdavclient3>=3.14.6",
    "chafa.py>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
skyviewtui = "weather_tui.app:main"

[project.urls]
Homepage = "https://github.com/sicnutaolei/SkyViewTUI"
Repository = "https://github.com/sicnutaolei/SkyViewTUI"
Issues = "https://github.com/sicnutaolei/SkyViewTUI/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
